# PXD004940 HeLa runs with Orbitrap MS2 (HCD_FT): same PEAKS parameters but a 0.02 Da fragment tolerance.
parent_mass_error_tolerance_ppm: 15.0
fragment_mass_error_tolerance_da: 0.02
precursor_mass_search_type: monoisotopic
enzyme: Trypsin
max_missed_cleavages: 2
digest_mode: Semi-Specific
peptide_length_min: 6
peptide_length_max: 45
fixed_modifications:
  - {name: Carbamidomethylation, residues: C}
variable_modifications:
  - {name: Deamidation, residues: NQ}
  - {name: Oxidation, residues: M}
max_variable_ptm_per_peptide: 3
database: /drive_a/drew/peaks-parity-work/fasta/human_sp_peaks_merged.fasta
deep_learning_boost: true
fdr_estimation: true
confident_amino_acid_threshold_pct: 2.0
peptide_fdr: 0.01
protein_score_min: 15.0
protein_unique_peptides_min: 1
denovo_alc_min_pct: 50.0
precursor_charges: [1, 4]
isotope_errors: [-1, 3]
threads: 16
